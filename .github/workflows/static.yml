name: Build ESP32 Firmware

on:
  push:
    branches: [ develop ]
  pull_request:
  workflow_dispatch: 
jobs:
  build-esp32:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com | sh
          
          # Оновлюємо індекси, передаючи URL напряму (ігноруючи конфіг)
          ./bin/arduino-cli core update-index --additional-urls https://raw.githubusercontent.com
          
          # Встановлюємо ядро
          ./bin/arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com

      - name: Compile firmware
        run: |
          mkdir -p build_output
          ./bin/arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --output-dir ./build_output \
            ./src \
            --additional-urls https://raw.githubusercontent.com

      - name: Upload compiled firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-bin
          path: build_output/*.bin
